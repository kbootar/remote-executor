openapi: 3.1.0

info:
  title: kbootar Proxy API
  description: |
    Backend proxy API for kbootar.

    The proxy resolves `{{variable}}` placeholders in the URL, headers, and body,
    manages the OAuth2 token lifecycle (client credentials), selects per-domain
    mTLS configuration server-side, and executes the outbound HTTP request via
    WebClient. Credentials never leave the server.
  version: 0.1.0
  contact:
    name: Karanbir Singh
    url: https://beta.kbootar.com

servers:
  - url: http://localhost:8080
    description: Local proxy (default)

tags:
  - name: Execute
    description: Execute outbound HTTP requests through the proxy
  - name: Mock
    description: Echo endpoint — useful for testing the proxy itself

paths:

  /api/execute:
    post:
      tags: [Execute]
      summary: Execute an HTTP request
      description: |
        Resolves `{{variable}}` placeholders, attaches auth, and proxies the
        request to the target URL. The `status` field in the response reflects
        the target API's HTTP status code, not the proxy call itself.

        **Auth strategies**
        | `authConfig.type` | Behaviour |
        |---|---|
        | `NONE` | No auth header added |
        | `BEARER_TOKEN` | Bearer token resolved from a `{{variable}}` already in `headers` |
        | `OAUTH2_CLIENT_CREDENTIALS` | Token fetched (and cached) using `environment.oauthConfig` |
        | `MTLS` | Client certificate selected via per-domain TLS registry (server config only) |

        TLS configuration is **not** accepted from callers — it is resolved server-side
        via `DomainTlsRegistry` based on the target hostname.
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            examples:
              simple_get:
                summary: GET with no auth
                value:
                  request:
                    id: req-001
                    name: Get Health
                    method: GET
                    url: "{{baseUrl}}/actuator/health"
                    headers: {}
                    authConfig:
                      type: NONE
                  environment:
                    id: env-local
                    name: Local
                    variables:
                      baseUrl: "https://api.example.com"
                  settings:
                    httpVersion: auto
                    sslVerification: false
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
              oauth2_post:
                summary: POST with OAuth2 client credentials
                value:
                  request:
                    id: req-002
                    name: Create Pet
                    method: POST
                    url: "{{baseUrl}}/pet"
                    headers:
                      Content-Type: application/json
                    body: '{"name":"doggie","status":"available"}'
                    authConfig:
                      type: OAUTH2_CLIENT_CREDENTIALS
                  environment:
                    id: env-prod
                    name: Production
                    variables:
                      baseUrl: "https://petstore3.swagger.io/api/v3"
                    oauthConfig:
                      tokenUri: "https://auth.example.com/oauth2/token"
                      encryptedClientId: "enc:abc123..."
                      encryptedClientSecret: "enc:xyz789..."
                      scope: "api:write"
                  settings:
                    httpVersion: auto
                    sslVerification: false
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
      responses:
        '200':
          description: |
            Request executed. Check `status` for the target API's HTTP status code —
            a `200` here does not mean the target returned 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '400':
          description: Invalid request payload
        '500':
          description: Proxy error (network failure, token fetch failure, etc.)

  /mock:
    get:
      tags: [Mock]
      summary: Echo at root path
      operationId: mockRootGet
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      summary: Echo POST at root path
      operationId: mockRootPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      operationId: mockRootPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      operationId: mockRootDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      operationId: mockRootPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

  /mock/{path}:
    parameters:
      - $ref: '#/components/parameters/MockPath'
    get:
      tags: [Mock]
      summary: Echo GET — any path depth below /mock
      operationId: mockGet
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      summary: Echo POST
      operationId: mockPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      summary: Echo PUT
      operationId: mockPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      summary: Echo DELETE
      operationId: mockDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      summary: Echo PATCH
      operationId: mockPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

components:

  parameters:
    MockPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: |
        Any path segment(s) below `/mock/`. Multi-segment paths (e.g. `/mock/a/b/c`)
        are matched by the Spring `/**` wildcard and all echoed back verbatim.

  responses:
    MockResponse:
      description: Echoed request details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockEchoResponse'

  schemas:

    ExecuteRequest:
      type: object
      required: [request, environment, settings]
      properties:
        request:
          $ref: '#/components/schemas/ApiRequest'
        environment:
          $ref: '#/components/schemas/Environment'
        settings:
          $ref: '#/components/schemas/RequestSettings'

    ApiRequest:
      type: object
      required: [method, url]
      properties:
        id:
          type: string
          description: Opaque request identifier (used for logging/history by the caller)
        collectionId:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
          description: Target URL. May contain `{{variable}}` placeholders resolved from `environment.variables`.
          example: "{{baseUrl}}/api/v1/users"
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
          nullable: true
          description: Raw request body string.
        authConfig:
          $ref: '#/components/schemas/AuthConfig'

    AuthConfig:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/AuthType'

    AuthType:
      type: string
      enum: [NONE, BEARER_TOKEN, OAUTH2_CLIENT_CREDENTIALS, MTLS]
      description: |
        - `NONE` — no auth
        - `BEARER_TOKEN` — Bearer token already in `headers` via `{{variable}}` substitution
        - `OAUTH2_CLIENT_CREDENTIALS` — token fetched and cached using `environment.oauthConfig`
        - `MTLS` — client cert selected server-side via `DomainTlsRegistry`

    Environment:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: env-prod
        name:
          type: string
          example: Production
        variables:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs. Values are substituted for `{{key}}` placeholders in the request.
          example:
            baseUrl: "https://api.example.com"
        oauthConfig:
          $ref: '#/components/schemas/OAuthConfig'
          description: Required when `authConfig.type` is `OAUTH2_CLIENT_CREDENTIALS`; omit otherwise.
          nullable: true

    OAuthConfig:
      type: object
      required: [tokenUri, encryptedClientId, encryptedClientSecret]
      properties:
        tokenUri:
          type: string
          format: uri
          example: "https://auth.example.com/oauth2/token"
        encryptedClientId:
          type: string
          description: AES-GCM encrypted value, prefixed with `enc:`. Decrypted server-side by `CredentialVault`.
          example: "enc:abc123..."
        encryptedClientSecret:
          type: string
          description: AES-GCM encrypted value, prefixed with `enc:`.
          example: "enc:xyz789..."
        scope:
          type: string
          nullable: true
          example: "api:read api:write"

    RequestSettings:
      type: object
      description: |
        HTTP client behaviour overrides. All fields are optional; defaults match
        `RequestSettings.defaults()` in the Java source.
      properties:
        httpVersion:
          type: string
          enum: [auto, "1.1", "2"]
          default: auto
          description: Force a specific HTTP version or let the client negotiate (`auto`).
        sslVerification:
          type: boolean
          default: false
          description: Verify the server's TLS certificate. Set `true` for production targets.
        followRedirects:
          type: boolean
          default: true
        followOriginalMethod:
          type: boolean
          default: false
          description: Preserve the HTTP method across redirects (e.g. POST stays POST). Default `false` follows RFC 7231 (POST may become GET on 302).
        followAuthHeader:
          type: boolean
          default: false
          description: Re-send the `Authorization` header on redirected requests.
        removeRefererOnRedirect:
          type: boolean
          default: false
        strictHttpParser:
          type: boolean
          default: false
        encodeUrl:
          type: boolean
          default: true
          description: Percent-encode the resolved URL before sending.
        disableCookieJar:
          type: boolean
          default: false
        serverCipherSuite:
          type: boolean
          default: false
          description: Use the server's cipher suite preference order rather than the client's.
        maxRedirects:
          type: integer
          default: 10
          minimum: 0
        disabledTlsProtocols:
          type: array
          items:
            type: string
          default: []
          example: ["TLSv1", "TLSv1.1"]
        cipherSuites:
          type: string
          default: ""
          description: Comma-separated cipher suite names. Empty string means server defaults.

    ProxyResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code returned by the target API.
          example: 200
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers from the target (collapsed to single string per header name).
        setCookies:
          type: array
          items:
            type: string
          description: Raw `Set-Cookie` header values from the target response.
        body:
          type: string
          nullable: true
          description: Response body as a string.
        durationMs:
          type: integer
          format: int64
          description: End-to-end proxy duration in milliseconds.
          example: 142
        resolvedUrl:
          type: string
          description: The actual URL sent to the target after `{{variable}}` substitution.
          example: "https://api.example.com/actuator/health"

    MockEchoResponse:
      type: object
      description: Echo of the incoming request, logged server-side.
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          example: /mock/pet/123
        queryParams:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Multi-value query parameters map.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers (multi-value joined with `, `).
        body:
          description: Raw request body string, or `null` if the request had no body.
          nullable: true
        _kbootar:
          type: string
          enum: [mock]
          description: Sentinel field — always `"mock"` to identify echo responses.
