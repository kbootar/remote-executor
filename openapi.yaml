openapi: 3.1.0

info:
  title: kbootar Proxy API
  description: |
    Backend proxy API for kbootar.

    Variable substitution, auth token management, and environment resolution
    happen on the client (app) side before the request reaches the proxy.
    The proxy receives a fully resolved HTTP request, applies server-side
    mTLS/CA configuration where configured, executes the outbound call via
    WebClient, and returns the response.
  version: 0.1.0
  contact:
    name: Karanbir Singh
    url: https://beta.kbootar.com

servers:
  - url: http://localhost:8080
    description: Local proxy (default)

tags:
  - name: Execute
    description: Execute outbound HTTP requests through the proxy
  - name: Mock
    description: Echo endpoint — useful for testing the proxy itself

paths:

  /api/execute:
    post:
      tags: [Execute]
      summary: Execute an HTTP request
      description: |
        Executes a fully resolved HTTP request. The proxy:
        1. Looks up the target hostname in `DomainTlsRegistry` for per-domain mTLS/CA config (server-side only — not accepted from callers)
        2. Builds a `WebClient` with the given `RequestSettings`
        3. Sends the request and streams the response back

        All `{{variable}}` substitution and auth token attachment are done by the
        calling app before this endpoint is invoked.
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            examples:
              simple_get:
                summary: GET with no auth
                value:
                  request:
                    method: GET
                    url: "https://api.example.com/actuator/health"
                    headers: {}
                  settings:
                    httpVersion: auto
                    sslVerification: true
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
              bearer_post:
                summary: POST with Bearer token (attached by the app)
                value:
                  request:
                    method: POST
                    url: "https://api.example.com/pet"
                    headers:
                      Content-Type: application/json
                      Authorization: "Bearer eyJhbGciOiJSUzI1NiJ9..."
                    body: '{"name":"doggie","status":"available"}'
                  settings:
                    httpVersion: auto
                    sslVerification: true
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
      responses:
        '200':
          description: |
            Request executed. Check `status` for the target API's HTTP status code —
            a `200` here does not mean the target returned 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '400':
          description: Invalid request payload
        '500':
          description: Proxy error (network failure, SSL context build failure, etc.)

  /mock:
    get:
      tags: [Mock]
      operationId: mockRootGet
      summary: Echo GET at /mock
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      operationId: mockRootPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      operationId: mockRootPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      operationId: mockRootDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      operationId: mockRootPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

  /mock/{path}:
    parameters:
      - $ref: '#/components/parameters/MockPath'
    get:
      tags: [Mock]
      summary: Echo GET — any path depth below /mock
      operationId: mockGet
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      operationId: mockPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      operationId: mockPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      operationId: mockDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      operationId: mockPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

components:

  parameters:
    MockPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: |
        Any path segment(s) below `/mock/`. Multi-segment paths (e.g. `/mock/a/b/c`)
        are matched by the Spring `/**` wildcard and echoed back verbatim.

  responses:
    MockResponse:
      description: Echoed request details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockEchoResponse'

  schemas:

    ExecuteRequest:
      type: object
      required: [request, settings]
      properties:
        request:
          $ref: '#/components/schemas/ApiRequest'
        settings:
          $ref: '#/components/schemas/RequestSettings'

    ApiRequest:
      type: object
      required: [method, url]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
          description: Fully resolved target URL — no `{{variable}}` placeholders.
          example: "https://api.example.com/v1/users"
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            HTTP headers to send. Auth headers (Bearer, Basic, etc.) should be
            attached here by the app before calling the proxy.
          example:
            Authorization: "Bearer eyJhbGciOiJSUzI1NiJ9..."
            Content-Type: "application/json"
        body:
          type: string
          nullable: true
          description: Raw request body string.

    RequestSettings:
      type: object
      description: |
        HTTP client behaviour overrides. All fields are optional; defaults match
        `RequestSettings.defaults()` in the Java source.
      properties:
        httpVersion:
          type: string
          enum: [auto, "1.1", "2"]
          default: auto
          description: Force a specific HTTP version or let the client negotiate (`auto`).
        sslVerification:
          type: boolean
          default: true
          description: Verify the server's TLS certificate. Set `true` for production targets.
        followRedirects:
          type: boolean
          default: true
        followOriginalMethod:
          type: boolean
          default: false
          description: Preserve the HTTP method across redirects (e.g. POST stays POST). Default `false` follows RFC 7231 (POST may become GET on 302).
        followAuthHeader:
          type: boolean
          default: false
          description: Re-send the `Authorization` header on redirected requests.
        removeRefererOnRedirect:
          type: boolean
          default: false
        strictHttpParser:
          type: boolean
          default: false
        encodeUrl:
          type: boolean
          default: true
          description: Percent-encode the URL before sending.
        disableCookieJar:
          type: boolean
          default: false
        serverCipherSuite:
          type: boolean
          default: false
          description: Use the server's cipher suite preference order rather than the client's.
        maxRedirects:
          type: integer
          default: 10
          minimum: 0
        disabledTlsProtocols:
          type: array
          items:
            type: string
          default: []
          example: ["TLSv1", "TLSv1.1"]
        cipherSuites:
          type: string
          default: ""
          description: Comma-separated cipher suite names. Empty string means server defaults.
        acceptEncoding:
          type: string
          default: "gzip, br, deflate"
          description: Comma-separated response compression codings. Empty disables automatic decompression.

    ProxyResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code returned by the target API.
          example: 200
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers from the target (collapsed to single string per name).
        setCookies:
          type: array
          items:
            type: string
          description: Raw `Set-Cookie` header values from the target response.
        body:
          type: string
          nullable: true
        durationMs:
          type: integer
          format: int64
          description: End-to-end proxy duration in milliseconds.
          example: 142
        url:
          type: string
          description: The URL that was sent to the target.
          example: "https://api.example.com/v1/users"

    MockEchoResponse:
      type: object
      description: Echo of the incoming request, logged server-side.
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          example: /mock/pet/123
        queryParams:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers (multi-value joined with `, `).
        body:
          description: Raw request body string, or `null` if no body.
          nullable: true
        _kbootar:
          type: string
          enum: [mock]
