openapi: 3.1.0

info:
  title: kbootar Proxy API
  description: |
    Backend proxy API for kbootar.

    Variable substitution, auth token management, and environment resolution
    happen on the client (app) side before the request reaches the proxy.
    The proxy receives a fully resolved HTTP request, applies server-side
    mTLS/CA configuration where configured, executes the outbound call via
    WebClient, and returns the response.

    This document is the contract for a Kbootar Remote Executor. Any service
    that implements `POST /api/execute` as described here can be used from the
    app's Remote mode. `/mock` is specific to this reference implementation and
    is not part of the contract.

    **Unknown fields.** The app currently sends extra top-level properties
    (`environment`, `proxySettings`, `bypass`) and extra `request` properties
    (`id`, `collectionId`, `name`, `authConfig`). They are not part of the
    contract; implementations must ignore them rather than reject the request.

    **Authentication to the executor** is not yet defined by this spec.
  version: 0.1.0
  contact:
    name: Karanbir Singh
    url: https://beta.kbootar.com

servers:
  - url: http://localhost:8080
    description: Local proxy (default)

tags:
  - name: Execute
    description: Execute outbound HTTP requests through the proxy
  - name: Mock
    description: Echo endpoint — useful for testing the proxy itself

paths:

  /api/execute:
    post:
      tags: [Execute]
      summary: Execute an HTTP request
      description: |
        Executes a fully resolved HTTP request. The proxy:
        1. Looks up the target hostname in `DomainTlsRegistry` for per-domain mTLS/CA config (server-side only — not accepted from callers)
        2. Builds a `WebClient` with the given `RequestSettings`
        3. Sends the request and streams the response back

        All `{{variable}}` substitution and auth token attachment are done by the
        calling app before this endpoint is invoked.
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            examples:
              simple_get:
                summary: GET with no auth
                value:
                  request:
                    method: GET
                    url: "https://api.example.com/actuator/health"
                    headers: {}
                  settings:
                    httpVersion: auto
                    sslVerification: true
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
              bearer_post:
                summary: POST with Bearer token (attached by the app)
                value:
                  request:
                    method: POST
                    url: "https://api.example.com/pet"
                    headers:
                      Content-Type: application/json
                      Authorization: "Bearer eyJhbGciOiJSUzI1NiJ9..."
                    body: '{"name":"doggie","status":"available"}'
                  settings:
                    httpVersion: auto
                    sslVerification: true
                    followRedirects: true
                    followOriginalMethod: false
                    followAuthHeader: false
                    removeRefererOnRedirect: false
                    strictHttpParser: false
                    encodeUrl: true
                    disableCookieJar: false
                    serverCipherSuite: false
                    maxRedirects: 10
                    disabledTlsProtocols: []
                    cipherSuites: ""
              base64_binary_put:
                summary: Binary body (bodyEncoding = base64)
                value:
                  request:
                    method: PUT
                    url: "https://api.example.com/files/logo.png"
                    headers:
                      Content-Type: image/png
                    body: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
                    bodyEncoding: base64
                  settings:
                    httpVersion: auto
                    sslVerification: true
              multipart_upload:
                summary: multipart/form-data with a text field and a file
                value:
                  request:
                    method: POST
                    url: "https://api.example.com/upload"
                    headers: {}
                    multipartBody:
                      - type: text
                        name: description
                        value: "Profile photo"
                      - type: file
                        name: file
                        fileName: photo.png
                        mimeType: image/png
                        base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
                  settings:
                    httpVersion: auto
                    sslVerification: true
      responses:
        '200':
          description: |
            Request executed. Check `status` for the target API's HTTP status code —
            a `200` here does not mean the target returned 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '400':
          description: Malformed request payload (for example, the body is not valid JSON).
        '502':
          description: |
            The executor could not complete the outbound call: TLS handshake
            failure, connection refused, timeout, an undecodable base64 body,
            or any other execution error. A response from the target with a
            4xx/5xx status is *not* an error here — it comes back as `200`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyError'
              examples:
                tls:
                  summary: TLS handshake failed
                  value:
                    error: SSL_HANDSHAKE_FAILED
                    message: "TLS handshake failed connecting to the target: PKIX path building failed — if the server uses a self-signed or private CA certificate, set sslVerification: false in request settings."
                refused:
                  summary: Target unreachable
                  value:
                    error: CONNECTION_REFUSED
                    message: "Could not connect to target: Connection refused"

  /mock:
    get:
      tags: [Mock]
      operationId: mockRootGet
      summary: Echo GET at /mock
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      operationId: mockRootPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      operationId: mockRootPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      operationId: mockRootDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      operationId: mockRootPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

  /mock/{path}:
    parameters:
      - $ref: '#/components/parameters/MockPath'
    get:
      tags: [Mock]
      summary: Echo GET — any path depth below /mock
      operationId: mockGet
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    post:
      tags: [Mock]
      operationId: mockPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    put:
      tags: [Mock]
      operationId: mockPut
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    delete:
      tags: [Mock]
      operationId: mockDelete
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'
    patch:
      tags: [Mock]
      operationId: mockPatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MockResponse'

components:

  parameters:
    MockPath:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: |
        Any path segment(s) below `/mock/`. Multi-segment paths (e.g. `/mock/a/b/c`)
        are matched by the Spring `/**` wildcard and echoed back verbatim.

  responses:
    MockResponse:
      description: Echoed request details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MockEchoResponse'

  schemas:

    ExecuteRequest:
      type: object
      required: [request, settings]
      additionalProperties: true
      description: Properties other than `request` and `settings` must be ignored.
      properties:
        request:
          $ref: '#/components/schemas/ApiRequest'
        settings:
          $ref: '#/components/schemas/RequestSettings'

    ApiRequest:
      type: object
      required: [method, url]
      additionalProperties: true
      description: |
        Body selection, in order of precedence:
        1. `multipartBody` (non-empty) — sent as `multipart/form-data`; the executor
           generates the boundary and `Content-Type`, so any caller-supplied
           `Content-Type` header is replaced.
        2. `bodyEncoding: base64` — `body` is base64-decoded and sent as raw bytes.
        3. Otherwise `body` is sent as-is (JSON, text, URL-encoded).
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        url:
          type: string
          description: Fully resolved target URL — no `{{variable}}` placeholders.
          example: "https://api.example.com/v1/users"
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            HTTP headers to send. Auth headers (Bearer, Basic, etc.) should be
            attached here by the app before calling the proxy.
          example:
            Authorization: "Bearer eyJhbGciOiJSUzI1NiJ9..."
            Content-Type: "application/json"
        body:
          type: [string, "null"]
          description: |
            Request body string. Plain text unless `bodyEncoding` is `base64`.
        bodyEncoding:
          type: [string, "null"]
          enum: [base64, null]
          description: Set to `base64` when `body` holds base64-encoded binary content.
        multipartBody:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/MultipartPart'
          description: Parts of a `multipart/form-data` request. Takes precedence over `body`.

    MultipartPart:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [text, file]
        name:
          type: string
          description: Form field name.
        value:
          type: [string, "null"]
          description: Field value. Used when `type` is `text`.
        fileName:
          type: [string, "null"]
          description: Filename sent in the part's `Content-Disposition`. Falls back to `name` when empty.
        mimeType:
          type: [string, "null"]
          description: Part content type. Falls back to `application/octet-stream` when empty.
        base64:
          type: [string, "null"]
          description: Base64-encoded file bytes. Used when `type` is `file`.

    RequestSettings:
      type: object
      description: |
        HTTP client behaviour overrides. All fields are optional; defaults match
        `RequestSettings.defaults()` in the Java source.
      properties:
        httpVersion:
          type: string
          enum: [auto, "1.1", "2"]
          default: auto
          description: Force a specific HTTP version or let the client negotiate (`auto`).
        sslVerification:
          type: boolean
          default: true
          description: Verify the server's TLS certificate. Set `true` for production targets.
        followRedirects:
          type: boolean
          default: true
        followOriginalMethod:
          type: boolean
          default: false
          description: Preserve the HTTP method across redirects (e.g. POST stays POST). Default `false` follows RFC 7231 (POST may become GET on 302).
        followAuthHeader:
          type: boolean
          default: false
          description: Re-send the `Authorization` header on redirected requests.
        removeRefererOnRedirect:
          type: boolean
          default: false
        strictHttpParser:
          type: boolean
          default: false
        encodeUrl:
          type: boolean
          default: true
          description: Percent-encode the URL before sending.
        disableCookieJar:
          type: boolean
          default: false
        serverCipherSuite:
          type: boolean
          default: false
          description: Use the server's cipher suite preference order rather than the client's.
        maxRedirects:
          type: integer
          default: 10
          minimum: 0
        disabledTlsProtocols:
          type: array
          items:
            type: string
          default: []
          example: ["TLSv1", "TLSv1.1"]
        cipherSuites:
          type: string
          default: ""
          description: Comma-separated cipher suite names. Empty string means server defaults.
        acceptEncoding:
          type: string
          default: "gzip, br, deflate"
          description: Comma-separated response compression codings. Empty disables automatic decompression.

    ProxyResponse:
      type: object
      required: [status, headers, setCookies, body, durationMs, resolvedUrl, httpVersion]
      properties:
        status:
          type: integer
          description: HTTP status code returned by the target API.
          example: 200
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Response headers from the target, collapsed to one string per name.
            `Set-Cookie` is also listed separately in `setCookies` so no cookie is lost.
        setCookies:
          type: array
          items:
            type: string
          description: |
            Raw `Set-Cookie` header values from the target, one entry per cookie.
            Empty array when there are none. The app stores these in its cookie jar.
        body:
          type: string
          description: Response body as text. Empty string when the target returned no body.
        durationMs:
          type: integer
          format: int64
          description: End-to-end executor duration in milliseconds.
          example: 142
        resolvedUrl:
          type: string
          description: |
            The final URL the executor requested after URL encoding and any redirects.
            May differ from the `url` in the request.
          example: "https://api.example.com/v1/users"
        httpVersion:
          type: string
          description: HTTP version negotiated with the target, as reported by the client.
          example: "HTTP/2"

    ProxyError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [SSL_HANDSHAKE_FAILED, CONNECTION_REFUSED, TIMEOUT, PROXY_ERROR]
          description: Stable error code. `PROXY_ERROR` is the catch-all.
        message:
          type: string
          description: Human-readable detail. The app shows this to the user.

    MockEchoResponse:
      type: object
      description: Echo of the incoming request, logged server-side.
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          example: /mock/pet/123
        queryParams:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers (multi-value joined with `, `).
        body:
          type: [string, "null"]
          description: Raw request body string, or `null` if no body.
        _kbootar:
          type: string
          enum: [mock]
