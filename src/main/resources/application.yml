spring:
  application:
    name: kbootar
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

kbootar:
  encryption:
    # Generate a key: export KBOOTAR_ENCRYPTION_KEY=$(openssl rand -base64 32)
    key: ${KBOOTAR_ENCRYPTION_KEY}
  workspace:
    dir: ${user.home}/.kbootar/workspaces/default

server:
  port: 8080
